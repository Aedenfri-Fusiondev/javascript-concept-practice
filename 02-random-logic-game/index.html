<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Heads or Tails Game</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h2>Heads or Tails</h2>

<div class="coin" id="coin">
  <div class="coin-face heads"></div>
  <div class="coin-face tails"></div>
</div>

<div class="buttons">

<button onclick="play('Heads')" class="btn-heads">
Heads
</button>

<button onclick="play('Tails')" class="btn-tails">
Tails
</button>

</div>

<button onclick="reset()" class="btn-reset">
Reset Score
</button>

<p id="result"></p>

</div>

<script src="script.js"></script>

</body>
</html>
